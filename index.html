<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: white;
  cursor: pointer;
  touch-action: manipulation;
}

#mensaje {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  font: 22px Arial, sans-serif;
  letter-spacing: 4px;
  color: black;
  pointer-events: none;
}

.emoji {
  position: fixed;
  left: 0;
  top: 0;
  width: 42px;
  height: 42px;
  font-size: 32px;
  line-height: 42px;
  text-align: center;
  pointer-events: none;
  user-select: none;
  will-change: transform;
}
</style>
</head>

<body>
<div id="mensaje">TAP</div>

<script>
const emojis = [
  "☁️", "🏹", "🙃", "🪭", "🍌", "🎠",
  "🎾", "🪸", "🎡", "🏰", "🪼", "🍄",
  "🧸", "🎢", "⛲️", "💊", "🍕", "🎪",
  "🥊", "🛼", "🍰", "🕸", "🐇", "☹️"
];

const tam = 42;
let anteriores = [];
let total = 0;
let generacion = 0;

function mezclar(lista) {
  for (let i = lista.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [lista[i], lista[j]] = [lista[j], lista[i]];
  }
  return lista;
}

function reiniciarSiHaceFalta() {
  // Reinicia al llenar aproximadamente toda la pantalla
  const capacidad = Math.ceil(
    window.innerWidth * window.innerHeight / (tam * tam) * 1.5
  );

  if (total >= capacidad) {
    generacion++;
    document.querySelectorAll(".emoji").forEach(el => el.remove());
    total = 0;
  }
}

document.body.addEventListener("pointerdown", function(event) {
  if (event.button !== undefined && event.button !== 0) return;

  document.getElementById("mensaje").style.display = "none";
  reiniciarSiHaceFalta();

  let disponibles = emojis.filter(e => !anteriores.includes(e));
  if (disponibles.length < 5) disponibles = [...emojis];

  const tanda = mezclar([...disponibles]).slice(0, 5);
  anteriores = tanda;

  const miGeneracion = generacion;
  total += tanda.length;

  tanda.forEach(simbolo => {
    const el = document.createElement("div");
    el.className = "emoji";
    el.textContent = simbolo;
    document.body.appendChild(el);

    let x = event.clientX - tam / 2;
    let y = event.clientY - tam / 2;

    const angulo = Math.random() * Math.PI * 2;
    const velocidad = 5 + Math.random() * 7;

    let vx = Math.cos(angulo) * velocidad;
    let vy = Math.sin(angulo) * velocidad - 4;

    const gravedad = 0.28;
    let rebotes = 0;
    let pasos = 0;

    function mover() {
      if (miGeneracion !== generacion || !el.isConnected) return;

      pasos++;

      vy += gravedad;
      x += vx;
      y += vy;

      const maxX = Math.max(0, window.innerWidth - tam);
      const maxY = Math.max(0, window.innerHeight - tam);

      // Rebotes laterales
      if (x < 0) {
        x = 0;
        vx = Math.abs(vx) * 0.65;
      } else if (x > maxX) {
        x = maxX;
        vx = -Math.abs(vx) * 0.65;
      }

      // Rebote en el techo
      if (y < 0) {
        y = 0;
        vy = Math.abs(vy) * 0.6;
      }

      // Rebote en el suelo, perdiendo energía
      if (y >= maxY) {
        y = maxY;
        vy = -Math.abs(vy) * 0.48;
        vx *= 0.88;
        rebotes++;
      }

      el.style.transform = `translate(${x}px, ${y}px)`;

      // Tras varios rebotes, termina y el emoji se queda
      if (
        (rebotes >= 5 && Math.abs(vy) < 3) ||
        pasos >= 240 ||
        (rebotes >= 8)
      ) {
        el.style.transform = `translate(${x}px, ${y}px)`;
        el.style.willChange = "auto";
        return;
      }

      requestAnimationFrame(mover);
    }

    el.style.transform = `translate(${x}px, ${y}px)`;
    requestAnimationFrame(mover);
  });
});
</script>
</body>
</html>
