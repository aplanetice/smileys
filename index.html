<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: white;
  touch-action: manipulation;
  cursor: pointer;
}

#mensaje {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  color: black;
  font: 22px Arial, sans-serif;
  letter-spacing: 4px;
  pointer-events: none;
}

.emoji {
  position: fixed;
  top: 0;
  left: 0;
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  font-size: 32px;
  pointer-events: none;
  user-select: none;
  will-change: transform;
}
</style>
</head>

<body>
<div id="mensaje">TAP</div>

<script>
const emojis = [
  "☁️", "🏹", "🙃", "🪭", "🍌", "🎠",
  "🎾", "🪸", "🎡", "🏰", "🪼", "🍄",
  "🧸", "🎢", "⛲️", "💊", "🍕", "🎪",
  "🥊", "🛼", "🍰", "🕸", "🐇", "☹️",

  "⚡️", "🔥", "💧", "🌧️", "🌊", "🐚",
  "🪻", "🌵", "🥥", "🍿", "🧃", "🥤",
  "🧋", "🍡", "🪩", "❌", "🛟"
];
const tam = 42;
const objetos = [];
let anteriores = [];
let ultimaTanda = [];
let ultimoToque = { x: innerWidth / 2, y: innerHeight / 2 };
let ultimoTiempo = 0;
let ronda = 0;

function mezclar(lista) {
  for (let i = lista.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [lista[i], lista[j]] = [lista[j], lista[i]];
  }
  return lista;
}

function limites() {
  return {
    x: Math.max(0, innerWidth - tam),
    y: Math.max(0, innerHeight - tam)
  };
}

function reiniciar() {
  ronda++;
  objetos.forEach(o => o.el.remove());
  objetos.length = 0;
  ultimaTanda = [];
}

function tocar(event) {
  if (event.button !== undefined && event.button !== 0) return;

  document.getElementById("mensaje").style.display = "none";
  ultimoToque = { x: event.clientX, y: event.clientY };

  // Reinicia al acumular suficientes emojis para llenar la pantalla
  const capacidad = Math.max(
    30,
    Math.floor(innerWidth * innerHeight / (tam * tam) * 1.15)
  );

  if (objetos.length + 5 > capacidad) reiniciar();

  let disponibles = emojis.filter(e => !anteriores.includes(e));

  if (disponibles.length < 5) disponibles = [...emojis];

  const tanda = mezclar([...disponibles]).slice(0, 5);
  anteriores = tanda;
  ultimaTanda = tanda;

  tanda.forEach(simbolo => {
    const el = document.createElement("div");
    el.className = "emoji";
    el.textContent = simbolo;
    document.body.appendChild(el);

    const angulo = Math.random() * Math.PI * 2;
    const velocidad = 2.5 + Math.random() * 4;

    objetos.push({
      el,
      x: event.clientX - tam / 2,
      y: event.clientY - tam / 2,
      vx: Math.cos(angulo) * velocidad,
      vy: Math.sin(angulo) * velocidad,
      giro: (Math.random() - 0.5) * 0.08,
      rotacion: Math.random() * 360
    });
  });
}

document.body.addEventListener("pointerdown", tocar);

// Una sola animación compartida para ahorrar trabajo en móvil
function animar(tiempo) {
  const dt = ultimoTiempo
    ? Math.min((tiempo - ultimoTiempo) / 16.67, 2)
    : 1;

  ultimoTiempo = tiempo;
  const borde = limites();

  for (const o of objetos) {
    o.x += o.vx * dt;
    o.y += o.vy * dt;
    o.rotacion += o.giro * dt;

    // Rebote continuo por los cuatro lados
    if (o.x <= 0) {
      o.x = 0;
      o.vx = Math.abs(o.vx);
    } else if (o.x >= borde.x) {
      o.x = borde.x;
      o.vx = -Math.abs(o.vx);
    }

    if (o.y <= 0) {
      o.y = 0;
      o.vy = Math.abs(o.vy);
    } else if (o.y >= borde.y) {
      o.y = borde.y;
      o.vy = -Math.abs(o.vy);
    }

    o.el.style.transform =
      `translate3d(${o.x}px, ${o.y}px, 0) rotate(${o.rotacion}deg)`;
  }

  requestAnimationFrame(animar);
}

requestAnimationFrame(animar);
</script>
</body>
</html>
