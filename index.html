<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: white;
  cursor: pointer;
  touch-action: manipulation;
}

#mensaje {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  font: 22px Arial, sans-serif;
  letter-spacing: 4px;
  color: black;
  pointer-events: none;
}

.emoji {
  position: fixed;
  left: 0;
  top: 0;
  width: 42px;
  height: 42px;
  font-size: 32px;
  line-height: 42px;
  text-align: center;
  pointer-events: none;
  user-select: none;
}
</style>
</head>

<body>

<div id="mensaje">TAP</div>

<script>
const emojis = [
  "☁️", "🏹", "🙃", "🪭", "🍌", "🎠",
  "🎾", "🪸", "🎡", "🏰", "🪼", "🍄",
  "🧸", "🎢", "⛲️", "💊", "🍕", "🎪",
  "🥊", "🛼", "🍰", "🕸", "🐇", "☹️"
];

const tam = 42;
let anteriores = [];
let ocupados = new Set();

function mezclar(lista) {
  for (let i = lista.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [lista[i], lista[j]] = [lista[j], lista[i]];
  }
  return lista;
}

function buscarHueco() {
  const columnas = Math.max(1, Math.floor(window.innerWidth / tam));
  const filas = Math.max(1, Math.floor(window.innerHeight / tam));

  // Busca huecos desde abajo hacia arriba
  for (let fila = filas - 1; fila >= 0; fila--) {
    const ordenColumnas = mezclar(
      Array.from({ length: columnas }, (_, i) => i)
    );

    for (const columna of ordenColumnas) {
      const clave = `${columna},${fila}`;

      if (!ocupados.has(clave)) {
        ocupados.add(clave);
        return {
          x: columna * tam,
          y: fila * tam
        };
      }
    }
  }

  // Si no quedan huecos, reinicia la pantalla
  document.querySelectorAll(".emoji").forEach(el => el.remove());
  ocupados.clear();

  return buscarHueco();
}

document.body.addEventListener("pointerdown", function(event) {
  if (event.button !== undefined && event.button !== 0) return;

  document.getElementById("mensaje").style.display = "none";

  let disponibles = emojis.filter(e => !anteriores.includes(e));

  if (disponibles.length < 5) {
    disponibles = [...emojis];
  }

  const tanda = mezclar([...disponibles]).slice(0, 5);
  anteriores = tanda;

  tanda.forEach(simbolo => {
    const destino = buscarHueco();
    const el = document.createElement("div");

    el.className = "emoji";
    el.textContent = simbolo;
    document.body.appendChild(el);

    const inicioX = event.clientX - tam / 2;
    const inicioY = event.clientY - tam / 2;

    const duracion = 35;
    let paso = 0;

    function mover() {
      paso++;

      const t = Math.min(1, paso / duracion);
      const suave = 1 - Math.pow(1 - t, 3);

      const x = inicioX + (destino.x - inicioX) * suave;
      const y = inicioY + (destino.y - inicioY) * suave;
      const arco = Math.sin(t * Math.PI) * 45;

      el.style.transform =
        `translate(${x}px, ${y - arco}px)`;

      if (t < 1) {
        requestAnimationFrame(mover);
      } else {
        el.style.transform =
          `translate(${destino.x}px, ${destino.y}px)`;
      }
    }

    el.style.transform =
      `translate(${inicioX}px, ${inicioY}px)`;

    requestAnimationFrame(mover);
  });
});
</script>

</body>
</html>
