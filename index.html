<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: white;
  touch-action: manipulation;
  cursor: pointer;
}

#mensaje {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  color: black;
  font: 22px Arial, sans-serif;
  letter-spacing: 4px;
  pointer-events: none;
}

.emoji {
  position: fixed;
  top: 0;
  left: 0;
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  font-size: 32px;
  pointer-events: none;
  user-select: none;
  will-change: transform;
}
</style>
</head>

<body>

<div id="mensaje">TAP ANYWHERE</div>

<script>
const emojis = [
  "☁️", "🏹", "🙃", "🪭", "🍌", "🎠",
  "🎾", "🪸", "🎡", "🏰", "🪼", "🍄",
  "🧸", "🎢", "⛲️", "💊", "🍕", "🎪",
  "🥊", "🛼", "🍰", "🕸", "🐇", "☹️",
  "⚡️", "🔥", "💧", "🌧️", "🌊", "🐚",
  "🪻", "🌵", "🥥", "🍿", "🧃", "🥤",
  "🧋", "🍡", "🪩", "❌", "🛟"
];

const tam = 42;
const objetos = [];
let anteriores = [];
let ultimoTiempo = 0;

function mezclar(lista) {
  for (let i = lista.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [lista[i], lista[j]] = [lista[j], lista[i]];
  }
  return lista;
}

function limites() {
  return {
    x: Math.max(0, window.innerWidth - tam),
    y: Math.max(0, window.innerHeight - tam)
  };
}

document.body.addEventListener("pointerdown", event => {
  if (event.button !== undefined && event.button !== 0) return;

  document.getElementById("mensaje").style.display = "none";

  // Evita repetir los emojis de la tanda inmediatamente anterior
  let disponibles = emojis.filter(
    emoji => !anteriores.includes(emoji)
  );

  if (disponibles.length < 5) {
    disponibles = [...emojis];
  }

  const tanda = mezclar([...disponibles]).slice(0, 5);
  anteriores = tanda;

  tanda.forEach(simbolo => {
    const el = document.createElement("div");
    el.className = "emoji";
    el.textContent = simbolo;
    document.body.appendChild(el);

    const angulo = Math.random() * Math.PI * 2;
    const velocidad = 2 + Math.random() * 3.5;

    objetos.push({
      el,
      x: Math.max(
        0,
        Math.min(event.clientX - tam / 2, window.innerWidth - tam)
      ),
      y: Math.max(
        0,
        Math.min(event.clientY - tam / 2, window.innerHeight - tam)
      ),
      vx: Math.cos(angulo) * velocidad,
      vy: Math.sin(angulo) * velocidad,
      giro: (Math.random() - 0.5) * 5,
      rotacion: Math.random() * 360
    });
  });
});

function animar(tiempo) {
  const dt = ultimoTiempo
    ? Math.min((tiempo - ultimoTiempo) / 16.67, 1.5)
    : 1;

  ultimoTiempo = tiempo;
  const borde = limites();

  for (const o of objetos) {
    o.x += o.vx * dt;
    o.y += o.vy * dt;
    o.rotacion += o.giro * dt;

    // Rebotes suaves en los cuatro bordes
    const amortiguacion = 0.92;

    if (o.x <= 0) {
      o.x = 0;
      o.vx = Math.abs(o.vx) * amortiguacion;
      o.giro += (Math.random() - 0.5) * 0.8;
    } else if (o.x >= borde.x) {
      o.x = borde.x;
      o.vx = -Math.abs(o.vx) * amortiguacion;
      o.giro += (Math.random() - 0.5) * 0.8;
    }

    if (o.y <= 0) {
      o.y = 0;
      o.vy = Math.abs(o.vy) * amortiguacion;
      o.giro += (Math.random() - 0.5) * 0.8;
    } else if (o.y >= borde.y) {
      o.y = borde.y;
      o.vy = -Math.abs(o.vy) * amortiguacion;
      o.giro += (Math.random() - 0.5) * 0.8;
    }

    // Pequeñas variaciones para un movimiento menos rígido
    o.vx += (Math.random() - 0.5) * 0.035;
    o.vy += (Math.random() - 0.5) * 0.035;

    o.el.style.transform =
      `translate3d(${o.x}px, ${o.y}px, 0) rotate(${o.rotacion}deg)`;
  }

  requestAnimationFrame(animar);
}

requestAnimationFrame(animar);
</script>

</body>
</html>
