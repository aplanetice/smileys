<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
    cursor: pointer;
}

#mensaje {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;

    font-family: Arial, sans-serif;
    font-size: 22px;
    letter-spacing: 4px;
    color: #777;

    pointer-events: none;
    transition: opacity 0.4s ease;
}

</style>
</head>

<body>

<div id="mensaje">✦ CLIC ✦</div>

<script>

const emojis = [
    "🪭",
    "🪼",
    "🎡",
    "🏰",
    "🛟",
    "🎢",
    "🍄",
    "🧸",
    "🐇",
    "🎠",
    "🏹",
    "🧁"
];

document.body.addEventListener("click", function(event) {

    document.getElementById("mensaje").style.opacity = "0";

    // 50 emojis por clic
    for (let i = 0; i < 50; i++) {

        const emoji = document.createElement("div");

        emoji.textContent =
            emojis[Math.floor(Math.random() * emojis.length)];

        emoji.style.position = "fixed";
        emoji.style.fontSize = (25 + Math.random() * 30) + "px";
        emoji.style.width = "50px";
        emoji.style.height = "50px";
        emoji.style.lineHeight = "50px";
        emoji.style.textAlign = "center";
        emoji.style.userSelect = "none";
        emoji.style.pointerEvents = "none";

        document.body.appendChild(emoji);

        // Empiezan cerca del clic
        let x = event.clientX - 25;
        let y = event.clientY - 25;

        // Más dispersión inicial
        x += (Math.random() - 0.5) * 180;
        y += (Math.random() - 0.5) * 100;

        // Muchísima más velocidad horizontal
        let vx = (Math.random() - 0.5) * 30;

        // Algunos salen hacia arriba con mucha fuerza
        let vy = -Math.random() * 22 - 5;

        const gravity = 0.38;
        const bounce = 0.78;

        function animate() {

            vy += gravity;

            x += vx;
            y += vy;

            const maxX = window.innerWidth - 50;
            const maxY = window.innerHeight - 50;

            // Rebote izquierda
            if (x <= 0) {
                x = 0;
                vx *= -bounce;
            }

            // Rebote derecha
            if (x >= maxX) {
                x = maxX;
                vx *= -bounce;
            }

            // Rebote suelo
            if (y >= maxY) {
                y = maxY;
                vy *= -bounce;

                if (Math.abs(vy) < 1) {
                    vy = 0;
                }
            }

            emoji.style.left = x + "px";
            emoji.style.top = y + "px";

            requestAnimationFrame(animate);
        }

        animate();
    }

});

</script>

</body>
</html>
