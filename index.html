<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: white;
  cursor: pointer;
  touch-action: manipulation;
}

#mensaje {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  color: black;
  font: 22px Arial, sans-serif;
  letter-spacing: 4px;
  pointer-events: none;
}

.emoji {
  position: fixed;
  left: 0;
  top: 0;
  width: 42px;
  height: 42px;
  font-size: 32px;
  line-height: 42px;
  text-align: center;
  pointer-events: none;
  user-select: none;
}
</style>
</head>

<body>
<div id="mensaje">TAP</div>

<script>
const emojis = [
  "☁️", "🏹", "🙃", "🪭", "🍌", "🎠",
  "🎾", "🪸", "🎡", "🏰", "🪼", "🍄",
  "🧸", "🎢", "⛲️", "💊", "🍕", "🎪",
  "🥊", "🛼", "🍰", "🕸", "🐇", "☹️"
];

const tam = 42;
let anteriores = [];
let total = 0;
let generacion = 0;
let nivel = 0;

function mezclar(lista) {
  for (let i = lista.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [lista[i], lista[j]] = [lista[j], lista[i]];
  }
  return lista;
}

document.body.addEventListener("pointerdown", event => {
  if (event.button !== undefined && event.button !== 0) return;

  document.getElementById("mensaje").style.display = "none";

  const capacidad = Math.ceil(
    window.innerWidth * window.innerHeight / (tam * tam)
  );

  // Al llenar la pantalla, comienza una ronda nueva
  if (total + 5 > capacidad) {
    generacion++;
    document.querySelectorAll(".emoji").forEach(el => el.remove());
    total = 0;
    nivel = 0;
  }

  let disponibles = emojis.filter(e => !anteriores.includes(e));
  if (disponibles.length < 5) disponibles = [...emojis];

  const tanda = mezclar([...disponibles]).slice(0, 5);
  anteriores = tanda;
  total += tanda.length;

  const miGeneracion = generacion;
  const maxX = Math.max(0, window.innerWidth - tam);
  const maxY = Math.max(0, window.innerHeight - tam);

  // Cada tanda ocupa una franja progresivamente más alta.
  // Dentro de la franja, el punto de aterrizaje es aleatorio.
  const alturaFranja = Math.max(50, window.innerHeight * 0.12);
  const baseY = Math.max(0, maxY - nivel * alturaFranja);
  nivel++;

  tanda.forEach(simbolo => {
    const el = document.createElement("div");
    el.className = "emoji";
    el.textContent = simbolo;
    document.body.appendChild(el);

    let x = event.clientX - tam / 2;
    let y = event.clientY - tam / 2;

    const destinoY = Math.max(
      0,
      baseY - Math.random() * alturaFranja
    );

    const destinoX = Math.random() * maxX;

    // Lanzamiento aleatorio para que reboten por la pantalla
    const angulo = Math.random() * Math.PI * 2;
    const velocidad = 6 + Math.random() * 7;
    let vx = Math.cos(angulo) * velocidad;
    let vy = Math.sin(angulo) * velocidad;

    let pasos = 0;
    let fase = "rebote";

    function mover() {
      if (!el.isConnected || miGeneracion !== generacion) return;

      pasos++;

      if (fase === "rebote") {
        x += vx;
        y += vy;

        const ancho = Math.max(0, window.innerWidth - tam);
        const alto = Math.max(0, window.innerHeight - tam);

        if (x <= 0) {
          x = 0;
          vx = Math.abs(vx) * 0.78;
        } else if (x >= ancho) {
          x = ancho;
          vx = -Math.abs(vx) * 0.78;
        }

        if (y <= 0) {
          y = 0;
          vy = Math.abs(vy) * 0.78;
        } else if (y >= alto) {
          y = alto;
          vy = -Math.abs(vy) * 0.78;
        }

        // Tras unos rebotes, se frena y se acomoda en la franja
        if (pasos > 24) {
          vx *= 0.975;
          vy *= 0.975;
        }

        if (pasos >= 100) {
          fase = "colocar";
        }
      } else {
        // Termina de acomodarse suavemente, sin cuadrícula
        x += (destinoX - x) * 0.07;
        y += (destinoY - y) * 0.07;

        if (Math.abs(destinoX - x) < 0.8 &&
            Math.abs(destinoY - y) < 0.8) {
          el.style.transform =
            `translate(${destinoX}px, ${destinoY}px)`;
          return;
        }
      }

      el.style.transform = `translate(${x}px, ${y}px)`;
      requestAnimationFrame(mover);
    }

    el.style.transform = `translate(${x}px, ${y}px)`;
    requestAnimationFrame(mover);
  });
});
</script>
</body>
</html>
