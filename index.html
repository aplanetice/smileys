<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: white;
  cursor: pointer;
  touch-action: manipulation;
}

#mensaje {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  font: 22px Arial, sans-serif;
  letter-spacing: 4px;
  color: #888;
  pointer-events: none;
}

.emoji {
  position: fixed;
  width: 42px;
  height: 42px;
  font-size: 32px;
  line-height: 42px;
  text-align: center;
  pointer-events: none;
  user-select: none;
}
</style>
</head>
<body>

<div id="mensaje">✦ CLIC ✦</div>

<script>
const emojis = ["☁️", "🏹", "🙃", "🪭", "🍌", "🎠", "🎾", "🪸"];
let started = false;

document.body.addEventListener("pointerdown", function(event) {
  if (event.button !== undefined && event.button !== 0) return;

  document.getElementById("mensaje").style.display = "none";
  started = true;

  const ancho = window.innerWidth;
  const alto = window.innerHeight;

  emojis.forEach((simbolo) => {
    const el = document.createElement("div");
    el.className = "emoji";
    el.textContent = simbolo;
    document.body.appendChild(el);

    let x = event.clientX - 21;
    let y = event.clientY - 21;

    // Gran dispersión en todas las direcciones
    const angulo = Math.random() * Math.PI * 2;
    const velocidad = 4 + Math.random() * 7;
    let vx = Math.cos(angulo) * velocidad;
    let vy = Math.sin(angulo) * velocidad - 3;

    const gravedad = 0.22;
    const rebote = 0.55;
    let rebotes = 0;

    function mover() {
      vy += gravedad;
      x += vx;
      y += vy;

      const maxX = window.innerWidth - 42;
      const maxY = window.innerHeight - 42;

      if (x < 0 || x > maxX) {
        x = Math.max(0, Math.min(x, maxX));
        vx *= -rebote;
      }

      if (y > maxY) {
        y = maxY;
        vy *= -rebote;
        rebotes++;
      }

      el.style.transform = `translate(${x}px, ${y}px)`;

      // Para ahorrar batería, termina al quedarse casi quieto
      if (rebotes >= 4 || (Math.abs(vx) < 0.25 && Math.abs(vy) < 0.5 && y >= maxY)) {
        el.style.transform = `translate(${x}px, ${Math.min(y, maxY)}px)`;
        return;
      }

      requestAnimationFrame(mover);
    }

    el.style.left = "0";
    el.style.top = "0";
    el.style.transform = `translate(${x}px, ${y}px)`;
    requestAnimationFrame(mover);
  });
});
</script>

</body>
</html>
